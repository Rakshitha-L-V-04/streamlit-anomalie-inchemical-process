.stage-wrap{position:relative}
#bg{position:absolute;inset:0;width:100%;height:100%;opacity:.55;transition:opacity .8s;pointer-events:none;z-index:0}
#v{position:relative;z-index:1;width:100%;height:100%}

.cap.show{opacity:.9}

.glow{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
.lamp .core{transition:fill .6s,opacity .6s}.lamp text{transition:fill .6s}

<script>
const PLANT={FT703:"Top product flow",FT704:"Reflux flow",FYI702:"Cooling water",PDI701:"Column Δp",PDI702:"Buffer vessel Δp",PY23:"Top pressure",T703:"Reboiler temp",T705:"Top C003 temp",T709:"Below C001 temp",T711:"C001–C002 temp",T712:"C002–C003 temp"};
const CATS=["transient","recurrent","permanent","unconfirmed"];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cat=c=>css('--c-'+(CATS.includes(c)?c:'unconfirmed'));
const TYPES=[['temp','temperature'],['flow','flow'],['press','pressure']];
const OPC={OP10:'#2a78d6',OP17:'#eb6834',OP18:'#1baf7a',OP22:'#d55181',OP29:'#6250d6',OP31:'#e09a00'};
const opc=o=>OPC[o]||'#888';const opTint=(o,k)=>d3.interpolateRgb(opc(o),css('--face')||'#fff')(k==null?.86:k);const opInk=o=>d3.color(opc(o)).darker(.7).formatHex();
const stype=s=>s[0]==='T'?'temp':s[0]==='F'?'flow':'press';
const tcol=s=>css('--t-'+stype(s));
const heat=v=>v<=1?css('--h0'):d3.interpolateRgbBasis([css('--h1'),css('--h2'),css('--h3')])(Math.min(1,(v-1)/2));
function heatGrad(id,x1,y1,x2,y2){let d=svg.select('defs');if(d.empty())d=svg.insert('defs',':first-child');d.select('#'+id).remove();
  const g=d.append('linearGradient').attr('id',id).attr('gradientUnits','userSpaceOnUse').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2);

  const R3=rU(UMAX),g=d.append('radialGradient').attr('id','rheat').attr('gradientUnits','userSpaceOnUse').attr('cx',0).attr('cy',0).attr('r',R3);
  [[R0/R3,'--h0'],[(R0+3)/R3,'--h1'],[(R0+3+SP)/R3,'--h2'],[1,'--h3']].forEach(([o,c])=>g.append('stop').attr('offset',o).attr('stop-color',css(c)));return'url(#rheat)'}

const R0=52,UMAX=3,SP=15,rU=u=>R0+2+Math.max(0,Math.min(UMAX,u)-1)*SP,ARC0=R0+2+(UMAX-1)*SP+8,AROW=8;
const BIG={x:330,y:372,k:2.3};const P={x0:720,x1:1165};
let D,S,TM,UN={},state={level:0,op:null,ev:null,sensor:null},busy=false;

function rng(t,a,b){const i0=d3.bisectLeft(t,a),i1=d3.bisectRight(t,b)-1;return[i0,Math.max(i0,i1)]}
function react(op,e,s){const R=D.ops[op],[i0,i1]=rng(R.t,e.s,e.e);return q(R.dev[s].slice(i0,i1+1),.9)}

const OUT={};function pctOut(op){if(OUT[op])return OUT[op];const R=D.ops[op],f=(arr,b)=>{const v=arr.filter(x=>x!=null);return v.length?v.filter(x=>x<b[0]||x>b[1]).length/v.length:0};
  const per=S.map(s=>({s,a:f(R.raw[s],R.band[s]),n:f(R.rawn[s],R.band[s])}));return OUT[op]={per,a:d3.mean(per,d=>d.a),n:d3.mean(per,d=>d.n)}}

  D=j;S=j.sensors;TM=Math.ceil(d3.max(Object.values(D.ops),o=>d3.max(o.t))/10)*10+10;
  for(const op in D.ops){const R=D.ops[op],u=R.t.map((_,i)=>d3.max(S,s=>R.dev[s][i]));UN[op]=u.map((v,i)=>d3.mean(u.slice(Math.max(0,i-3),i+4)));
    const un=R.tn.map((_,i)=>d3.max(S,s=>R.devn[s][i]));UNN[op]=un.map((v,i)=>d3.mean(un.slice(Math.max(0,i-3),i+4)))}
  d3.select('#legend').html(CATS.map(c=>`<span><i style="background:${cat(c)}"></i>${c}</span>`).join('')+`<span><i style="background:linear-gradient(90deg,var(--h1),var(--h2),var(--h3));border-radius:2px;width:22px"></i>unrest</span><span style="margin-left:10px;color:var(--ink3)">|</span>`+TYPES.map(([k,n])=>`<span><i style="background:var(--t-${k});border-radius:2px"></i>${n}</span>`).join('')+`<span style="margin-left:10px;color:var(--ink3)">|</span><span><i style="background:var(--norm)"></i>inside: normal run</span><span><i style="background:var(--h2)"></i>outside: anomalous run</span>`);
  level0(true);
});

function crumbs(){
  const c=[['◉ Overview',()=>level0()]];
  if(state.op)c.push([state.op,()=>level1(state.op)]);
  if(state.ev)c.push([state.ev.sid,()=>level2(state.ev)]);
  if(state.sensor)c.push([state.sensor,null]);
  const el=d3.select('#crumbs').html('');
  c.forEach((d,i)=>{if(i)el.append('span').attr('class','sep').text('›');
    const last=i===c.length-1;el.append(last?'span':'button').attr('class',last?'cur':null).style('color',d[0]===state.op?opc(state.op):null).text(d[0]).on('click',last?null:()=>{if(!busy)d[1]()})});
  if(typeof setBtns==='function')setBtns();
  d3.select('#bg').style('opacity',[0.5,0.13,0.1,0.1][state.level]);
  d3.select('#hint').text(['Click a clock','Click an anomaly arc or a sensor bar','Hover the lines to read every sensor',''][state.level]);
}

/* ---------- one clock, drawn at origin ---------- */

  g.append('circle').attr('class','face').attr('r',ARC0+AROW*4+6).attr('fill',opTint(op)).attr('fill-opacity',.74).attr('stroke',opc(op)).attr('stroke-opacity',.55).attr('stroke-width',1.6).attr('vector-effect','non-scaling-stroke');

  g.append('path').attr('d',d3.arc()({innerRadius:R0-1,outerRadius:R0,startAngle:0,endAngle:TAU})).attr('fill',css('--line2'));

  g.append('path').attr('d',d3.areaRadial().angle((d,i)=>ang(R.tn[i])).innerRadius(d=>rN(d)).outerRadius(R0-3).curve(d3.curveMonotoneX)(UNN[op])).attr('fill',css('--norm'));
  const [ex,ey]=pol(tEnd,R0+6);g.append('circle').attr('cx',ex).attr('cy',ey).attr('r',2.2).attr('fill',css('--ink3'));

  const geom=(e,end)=>({innerRadius:ARC0+e.row*AROW,outerRadius:ARC0+e.row*AROW+AROW-2.5,startAngle:ang(e.s),endAngle:Math.max(ang(e.s)+0.03,ang(end))});
  if(intro){a.attr('d',e=>arc(geom(e,e.s))).transition().delay(e=>300+e.s*6).duration(700).ease(d3.easeCubicOut).attrTween('d',e=>t=>arc(geom(e,e.s+(e.e-e.s)*t)));
    ap.attr('transform','scale(0.6)').attr('opacity',0).transition().duration(900).ease(d3.easeBackOut).attr('transform','scale(1)').attr('opacity',1);}
  else a.attr('d',e=>arc(geom(e,e.e)));

  const po=pctOut(op);

  g.append('text').attr('class','sublabel').attr('text-anchor','middle').attr('y',39).style('font-size','8.5px').style('fill',css('--ink3')).text('time out of ideal');

}
function clockPos(i){const cols=3,cw=VW/cols,ch=(VH-20)/2;return{x:cw*(i%cols)+cw/2,y:ch*Math.floor(i/cols)+ch/2+18}}

/* ---------- level 0: all runs ---------- */
function level0(intro){
  stopReplay(true);
  state={level:0,op:null,ev:null,sensor:null};crumbs();hideTip();
  svg.selectAll('*').interrupt().remove();
  const ops=Object.keys(D.ops);
  ops.forEach((op,i)=>{
    const p=clockPos(i);
    const g=svg.append('g').attr('class','clock hit').attr('data-op',op).attr('transform',`translate(${p.x},${p.y})`);
    const inner=g.append('g');
    const {list}=drawClock(inner,op,{intro:true});
    g.on('pointerenter',()=>inner.transition().duration(200).attr('transform','scale(1.06)'))
     .on('pointerleave',()=>{inner.transition().duration(200).attr('transform','scale(1)');hideTip()})
     .on('pointermove',e=>{const pk=d3.max(UN[op]);showTip(`<b>${op}</b><br>${list.length} events · ${d3.max(D.ops[op].t).toFixed(0)} min<br><span style="color:${css('--norm')}">normal run: ${(pctOut(op).n*100).toFixed(1)}% out of ideal</span><br><span style="color:${css('--h3')}">anomalous run: ${(pctOut(op).a*100).toFixed(1)}% out of ideal</span>`,e)})
     .on('click',()=>{if(!busy)level1(op,true)});
    if(intro)g.attr('opacity',0).transition().delay(i*90).duration(400).attr('opacity',1);
  });
  const k=svg.append('g').attr('transform',`translate(${VW-120},${VH-30})`).attr('opacity',.9);
  k.append('text').attr('text-anchor','middle').style('font-size','11.5px').text('↻ time runs clockwise from 12');
}

/* ---------- level 1: one run ---------- */
function level1(op,fromGrid){
  stopReplay(true);hideTip();busy=true;
  const done=()=>{busy=false};
  const prev=state.level;state={level:1,op,ev:null,sensor:null};crumbs();
  let g=svg.select(`g.clock[data-op="${op}"]`);
  if(fromGrid&&!g.empty()){
    svg.selectAll('g.clock').filter(function(){return this!==g.node()}).transition().duration(450).attr('opacity',0).remove();
    svg.selectAll('g:not(.clock)').filter(function(){return this.parentNode===svg.node()&&!this.classList.contains('clock')}).remove();
    g.on('pointerenter',null).on('pointerleave',null).on('pointermove',null).on('click',null).classed('hit',false);
    g.select('g').interrupt().attr('transform','scale(1)');
    g.raise().transition().duration(850).ease(d3.easeCubicInOut).attr('transform',`translate(${BIG.x},${BIG.y}) scale(${BIG.k})`).on('end',()=>{decorate(g,op);done()});
  }else{
    svg.selectAll('*').interrupt().remove();
    g=svg.append('g').attr('class','clock').attr('data-op',op).attr('transform',`translate(${BIG.x},${BIG.y}) scale(${BIG.k})`);
    drawClock(g.append('g'),op);g.attr('opacity',0).transition().duration(400).attr('opacity',1).on('end',()=>{decorate(g,op);done()});
  }
}

/* ---------- level 2: one event, unrolled ---------- */
const L2={x0:150,x1:1110,bandY:120,bandH:62,rowY:220,rowH:72,nRows:6};
function level2(e,unroll){
  stopReplay(true);hideTip();busy=true;
  const op=e.op,R=D.ops[op];state={level:2,op,ev:e,sensor:null};crumbs();
  const tEnd=d3.max(R.t),dom=e.cat==='permanent'?[0,tEnd]:[Math.max(0,e.s-15),Math.min(tEnd,e.e+15)];
  const X=d3.scaleLinear(dom,[L2.x0,L2.x1]);
  const [i0,i1]=rng(R.t,dom[0],dom[1]),ts=R.t.slice(i0,i1+1),us=UN[op].slice(i0,i1+1);
  const k=BIG.k;
  const polTop=(t,u)=>{const [x,y]=pol(t,rU(u));return[BIG.x+x*k,BIG.y+y*k]};
  const polBase=t=>{const [x,y]=pol(t,R0);return[BIG.x+x*k,BIG.y+y*k]};
  const linTop=(t,u)=>[X(t),L2.bandY+L2.bandH-Math.min(UMAX,u)/UMAX*L2.bandH];
  const linBase=t=>[X(t),L2.bandY+L2.bandH];
  const lerp=(a,b,s)=>[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s];
  const bandPath=s=>{const top=ts.map((t,i)=>lerp(polTop(t,us[i]),linTop(t,us[i]),s)),base=ts.map(t=>lerp(polBase(t),linBase(t),s)).reverse();return'M'+top.concat(base).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z'};
  const er=ARC0+e.row*AROW,ea=Math.max(e.s,dom[0]),eb=Math.min(e.e,dom[1]),N=40,es=d3.range(N+1).map(j=>ea+(eb-ea)*j/N);
  const arcPath=s=>{const o=es.map(t=>{const [x,y]=pol(t,er+AROW-2.5);return lerp([BIG.x+x*k,BIG.y+y*k],[X(t),L2.bandY-16],s)}),
    n=es.map(t=>{const [x,y]=pol(t,er);return lerp([BIG.x+x*k,BIG.y+y*k],[X(t),L2.bandY-8],s)}).reverse();return'M'+o.concat(n).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z'};
  const fromClock=unroll&&!svg.select('g.clock').empty();
  if(fromClock){svg.selectAll('g.deco').transition().duration(300).attr('opacity',0).remove();svg.selectAll('g.clock').transition().delay(500).duration(700).attr('opacity',0).remove()}else svg.selectAll('*').interrupt().remove();
  const stage=svg.append('g').attr('class','stage');
  const band=stage.append('path').attr('class','keep').attr('fill',heatGrad('bh',0,L2.bandY+L2.bandH,0,L2.bandY));
  const earc=stage.append('path').attr('class','keep').attr('fill',cat(e.cat));
  const T=fromClock?1100:500;
  if(fromClock){band.attr('d',bandPath(0));earc.attr('d',arcPath(0));
    band.transition().delay(150).duration(T).ease(d3.easeCubicInOut).attrTween('d',()=>s=>bandPath(s));
    earc.transition().delay(150).duration(T).ease(d3.easeCubicInOut).attrTween('d',()=>s=>arcPath(s)).on('end',build);
  }else{band.attr('d',bandPath(1));earc.attr('d',arcPath(1));build()}
  function build(){
    busy=false;
    const ax=stage.append('g').attr('class','axis keep').attr('transform',`translate(0,${L2.bandY+L2.bandH})`).call(d3.axisBottom(X).ticks(8).tickFormat(d=>d+' min')).attr('opacity',0);
    ax.transition().duration(300).attr('opacity',1);
    stage.append('line').attr('class','keep').attr('x1',L2.x0).attr('x2',L2.x1).attr('y1',L2.bandY+L2.bandH-L2.bandH/UMAX).attr('y2',L2.bandY+L2.bandH-L2.bandH/UMAX).attr('stroke',css('--ink3')).attr('stroke-dasharray','3 3');
    stage.append('text').attr('class','keep').attr('x',L2.x0-12).attr('y',L2.bandY+L2.bandH-6).attr('text-anchor','end').style('font-size','12px').text('unrest');
    stage.append('text').attr('class','keep').attr('x',L2.x0-12).attr('y',L2.bandY-8).attr('text-anchor','end').style('font-weight',700).style('fill',cat(e.cat)).text(e.sid);
    stage.append('text').attr('class','keep').attr('x',(X(ea)+X(eb))/2).attr('y',L2.bandY-24).attr('text-anchor','middle').style('font-size','12.5px').style('fill',css('--ink2')).text(shortP(e.p));
    const ranked=S.map(s=>({s,v:react(op,e,s),ann:e.sens.includes(s)})).sort((a,b)=>b.v-a.v).slice(0,L2.nRows);
    const yTop=L2.rowY,H=L2.rowH*ranked.length;
    stage.append('rect').attr('x',X(ea)).attr('width',Math.max(1,X(eb)-X(ea))).attr('y',yTop).attr('height',H).attr('fill',cat(e.cat)).attr('opacity',0).transition().duration(400).attr('opacity',.1);
    const [j0,j1]=rng(R.tn,dom[0],dom[1]);
    const sc={};
    ranked.forEach((d,r)=>{
      const y0=yTop+r*L2.rowH,g=stage.append('g').attr('class','row').attr('opacity',0);
      const va=R.raw[d.s].slice(i0,i1+1),vn=R.rawn[d.s].slice(j0,j1+1);
      const bd=R.band[d.s];
      let ex=d3.extent(va.concat(bd,vn).filter(v=>v!=null));if(ex[0]===ex[1])ex=[ex[0]-1,ex[1]+1];const pad=(ex[1]-ex[0])*.08;ex=[ex[0]-pad,ex[1]+pad];
      const Y=d3.scaleLinear(ex,[y0+L2.rowH-8,y0+8]);sc[d.s]=Y;
      g.append('rect').attr('class','bgr').attr('x',20).attr('width',VW-40).attr('y',y0).attr('height',L2.rowH).attr('fill','transparent');
      g.append('line').attr('x1',L2.x0).attr('x2',L2.x1).attr('y1',y0+L2.rowH).attr('y2',y0+L2.rowH).attr('stroke',css('--line'));
      g.append('text').attr('x',L2.x0-12).attr('y',y0+L2.rowH/2).attr('text-anchor','end').style('font-weight',700).style('fill',css('--ink')).text((d.ann?'◆ ':'')+d.s);
      g.append('text').attr('x',L2.x0-12).attr('y',y0+L2.rowH/2+16).attr('text-anchor','end').style('font-size','11.5px').text(PLANT[d.s]);
      const hot=d.v>1;
      const tc=tcol(d.s);g.append('rect').attr('x',L2.x0).attr('width',L2.x1-L2.x0).attr('y',Y(bd[1])).attr('height',Math.max(1,Y(bd[0])-Y(bd[1]))).attr('fill',tc).attr('opacity',.13);
      [bd[0],bd[1]].forEach(v=>g.append('line').attr('x1',L2.x0).attr('x2',L2.x1).attr('y1',Y(v)).attr('y2',Y(v)).attr('stroke',tc).attr('stroke-opacity',.55).attr('stroke-width',.8).attr('stroke-dasharray','2 3'));
      g.append('rect').attr('x',L2.x0-8).attr('width',3).attr('y',y0+8).attr('height',L2.rowH-16).attr('rx',1.5).attr('fill',tc);
      const out=ts.map((t,i)=>({t,v:va[i]})).filter(q=>q.v!=null),frac=out.filter(q=>q.v<bd[0]||q.v>bd[1]).length/Math.max(1,out.length);
      g.append('text').attr('x',L2.x1+40).attr('y',y0+L2.rowH-4).attr('text-anchor','middle').style('font-size','10.5px').style('fill',frac>.05?css('--crit'):css('--ink3')).text(Math.round(frac*100)+'% out');
      g.append('circle').attr('cx',L2.x1+40).attr('cy',y0+L2.rowH/2).attr('r',0).attr('fill',heat(d.v)).transition().delay(300+r*80).duration(500).ease(d3.easeBackOut).attr('r',8+Math.min(5,d.v)*3.2);
      g.append('text').attr('x',L2.x1+40).attr('y',y0+L2.rowH/2+4).attr('text-anchor','middle').style('font-size','12px').style('font-weight',700).style('fill',d.v>1.6?'#fff':css('--ink')).text(d.v.toFixed(1));
      const ln=d3.line().x(p=>X(p.t)).y(p=>Y(p.v));
      const np=R.tn.slice(j0,j1+1).map((t,i)=>({t,v:vn[i]})).filter(p=>p.v!=null);
      if(np.length)g.append('path').attr('d',ln(np)).attr('fill','none').attr('stroke',css('--norm')).attr('stroke-width',1.4).attr('stroke-dasharray','4 3').attr('opacity',.9);
      const p=g.append('path').attr('d',ln(out)).attr('fill','none').attr('stroke',tc).attr('stroke-width',1.7);
      const isOut=q=>q.v<bd[0]||q.v>bd[1];
      const segs=[];let cur=null;out.forEach((q,i)=>{if(isOut(q)){if(!cur){cur=i>0?[out[i-1]]:[];segs.push(cur)}cur.push(q)}else if(cur){cur.push(q);cur=null}});
      g.selectAll('path.out').data(segs).join('path').attr('class','out').attr('d',sg=>ln(sg)).attr('fill','none').attr('stroke',css('--h3')).attr('stroke-width',2.8).attr('stroke-linecap','round').attr('opacity',0).transition().delay(900+r*80).duration(400).attr('opacity',1);
      const L=p.node().getTotalLength();p.attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L).transition().delay(150+r*80).duration(900).ease(d3.easeCubicOut).attr('stroke-dashoffset',0);
      g.transition().delay(r*80).duration(300).attr('opacity',1);
      g.on('pointerenter',function(){d3.select(this).select('.bgr').attr('fill',css('--line')).attr('opacity',.5)})
       .on('pointerleave',function(){d3.select(this).select('.bgr').attr('fill','transparent');hideTip();cross.style('display','none')})
    });
    const cross=stage.append('line').attr('y1',L2.bandY).attr('y2',yTop+H).attr('stroke',css('--ink3')).style('display','none').style('pointer-events','none');
    stage.selectAll('g.row').on('pointermove',ev=>{const [px]=d3.pointer(ev,svg.node());if(px<L2.x0||px>L2.x1){cross.style('display','none');return}
      const t=X.invert(px),i=Math.min(R.t.length-1,d3.bisectLeft(R.t,t));cross.attr('x1',X(R.t[i])).attr('x2',X(R.t[i])).style('display',null);
      showTip(`<b>${R.t[i].toFixed(1)} min</b><table><tr class="m"><td></td><td>now</td><td>ideal</td><td></td></tr>${ranked.map(d=>{const v=R.raw[d.s][i],b=R.band[d.s],o=v!=null&&(v<b[0]||v>b[1]);return`<tr><td><b>${d.s}</b></td><td style="color:${o?css('--crit'):css('--ink')}">${v??'–'}</td><td class="m">${b[0]}–${b[1]}</td><td style="color:${o?css('--crit'):css('--c-permanent')}">${o?(v>b[1]?'▲ high':'▼ low'):'✓'}</td></tr>`}).join('')}</table>`,ev)});
    const lg=stage.append('g').attr('transform',`translate(${L2.x0},${yTop+H+12})`);
    lg.append('rect').attr('width',22).attr('height',12).attr('fill',css('--t-flow')).attr('opacity',.18).attr('stroke',css('--t-flow')).attr('stroke-dasharray','2 3');
    lg.append('text').attr('x',30).attr('y',10).style('font-size','12px').text('ideal range (middle 98% of normal run)');
    lg.append('line').attr('x1',300).attr('x2',322).attr('y1',6).attr('y2',6).attr('stroke',css('--t-flow')).attr('stroke-width',1.7);
    lg.append('text').attr('x',330).attr('y',10).style('font-size','12px').text('anomalous run');
    lg.append('line').attr('x1',580).attr('x2',602).attr('y1',6).attr('y2',6).attr('stroke',css('--norm')).attr('stroke-width',1.6).attr('stroke-dasharray','4 3');
    lg.append('text').attr('x',610).attr('y',10).style('font-size','12px').text('normal run (same minute)');
    lg.append('line').attr('x1',440).attr('x2',462).attr('y1',6).attr('y2',6).attr('stroke',css('--h3')).attr('stroke-width',2.8);
    lg.append('text').attr('x',470).attr('y',10).style('font-size','12px').text('outside ideal');
    stage.append('text').attr('x',L2.x1+40).attr('y',yTop-8).attr('text-anchor','middle').style('font-size','11.5px').style('fill',css('--ink3')).text('score');
  }
}
let PX=null,RP=null,RT=null,storyOn=false;
let paused=false,repWasOn=false;
function setBtns(){
  let lab='▶ Play',on=false;
  if(storyOn){lab=paused?'▶ Resume':'❚❚ Pause';on=!paused}
  else if(RT){lab='❚❚ Pause';on=true}
  else if(state.level===1&&RP&&RP.t>0.5&&RP.t<RP.tEnd-0.5)lab='▶ Resume';
  d3.select('#storyBtn').text(lab).classed('on',on);
  d3.select('#stopBtn').style('display',storyOn?null:'none');
}
function stopReplay(hard){if(RT){RT.stop();RT=null}if(hard){RP=null;PX=null}if(typeof setBtns==='function')setBtns()}
function buildReplay(lab,op,inner){
  const R=D.ops[op],k=BIG.k,tEnd=d3.max(R.t),rO=(ARC0+AROW*2)*k,rI=R0*k;
  const order=S.slice().sort((a,b)=>'tfp'.indexOf(stype(a)[0])-'tfp'.indexOf(stype(b)[0]));
  const trail=lab.append('path').attr('fill',css('--h2')).attr('opacity',0).attr('transform',`translate(${BIG.x},${BIG.y})`).style('pointer-events','none');
  const hand=lab.append('line').attr('x1',BIG.x).attr('y1',BIG.y).attr('stroke',css('--ink')).attr('stroke-width',2.5).attr('stroke-linecap','round').attr('opacity',0).style('pointer-events','none');
  const tip=lab.append('circle').attr('r',5).attr('fill',css('--ink')).attr('opacity',0).style('pointer-events','none');
  const live=lab.append('g').attr('opacity',0).style('pointer-events','none');
  const clock=live.append('text').attr('x',BIG.x).attr('y',BIG.y+2).attr('text-anchor','middle').style('font-size','24px').style('font-weight',700).style('fill',css('--ink'));
  const toast=live.append('text').attr('x',BIG.x).attr('y',BIG.y+24).attr('text-anchor','middle').style('font-size','12px').style('font-weight',600);
  const LR=82;
  const lamps=live.selectAll('g.lamp').data(order).join('g').attr('class','lamp').attr('transform',(s,j)=>{const a=j/order.length*TAU;return`translate(${BIG.x+Math.sin(a)*LR},${BIG.y-Math.cos(a)*LR-6})`});
  lamps.append('circle').attr('class','halo').attr('r',7).attr('fill','none').attr('stroke',css('--h3')).attr('stroke-width',2).attr('opacity',0);
  lamps.append('circle').attr('class','core').attr('r',6).attr('fill',s=>tcol(s)).attr('opacity',.45);
  lamps.append('text').attr('y',19).attr('text-anchor','middle').style('font-size','9.5px').style('fill',css('--ink2')).text(s=>s);
  const arcs=inner.selectAll('path.ev');
  RP={tEnd,start(){lab.selectAll('.mlab').transition().duration(300).attr('opacity',0);inner.select('.oplabel').transition().duration(300).attr('opacity',0);
      [trail,hand,tip].forEach(x=>x.transition().duration(300).attr('opacity',x===trail?.12:1));live.transition().duration(300).attr('opacity',1);PX&&PX.line.attr('opacity',1)},
    set(t){t=Math.max(0,Math.min(tEnd,t));const a=ang(t),i=Math.min(R.t.length-1,d3.bisectLeft(R.t,t));
      const hx=BIG.x+Math.sin(a)*rO,hy=BIG.y-Math.cos(a)*rO;hand.attr('x1',BIG.x+Math.sin(a)*(rI+4)).attr('y1',BIG.y-Math.cos(a)*(rI+4)).attr('x2',hx).attr('y2',hy);tip.attr('cx',hx).attr('cy',hy);
      trail.attr('d',d3.arc()({innerRadius:rI,outerRadius:rO,startAngle:0,endAngle:a}));
      clock.text(Math.round(t)+' min');
      lamps.each(function(s){const v=R.raw[s][i],b=R.band[s],o=v!=null&&(v<b[0]||v>b[1]),me=d3.select(this);
        me.select('.core').style('fill',o?css('--h3'):tcol(s)).style('opacity',o?1:.45).attr('r',o?8:6);
        me.select('.halo').classed('glow',o).attr('opacity',o?1:0);me.select('text').style('font-weight',o?700:400).style('fill',o?css('--h3'):css('--ink2'))});
      const act=arcs.data().filter(e=>e.cat!=='permanent'&&t>=e.s&&t<=e.e);
      arcs.attr('stroke',e=>act.includes(e)?css('--ink'):null).attr('stroke-width',e=>act.includes(e)?2:0).attr('vector-effect','non-scaling-stroke');
      toast.text(act.length?'● '+act[0].sid+' active':'').style('fill',act.length?cat(act[0].cat):css('--ink'));
      if(PX)PX.line.attr('x1',PX.x(t)).attr('x2',PX.x(t));RP.t=t}};
  RP.set(0);
}
function startReplay(secs){if(!RP)return;if(RT){RT.stop();RT=null}RP.start();const t0=RP.t>=RP.tEnd-1?0:RP.t||0;if(secs)RP.rate=RP.tEnd/secs;const rate=RP.rate||RP.tEnd/16;
  RT=d3.timer(el=>{const t=t0+el/1000*rate;RP.set(t);if(t>=RP.tEnd)stopReplay()});setBtns()}
function caption(txt){const c=d3.select('#cap');if(!txt){c.classed('show',false);return}c.classed('show',false);setTimeout(()=>c.text(txt).classed('show',true),txt?250:0)}
const wait=ms=>new Promise(res=>{let left=ms,last=performance.now();const tick=()=>{const now=performance.now();if(!paused)left-=now-last;last=now;if(!storyOn||left<=0)return res();setTimeout(tick,40)};setTimeout(tick,40)});
async function story(){
  storyOn=true;paused=false;setBtns();
  const ok=()=>storyOn,ops=Object.keys(D.ops);
  const nev=d3.sum(ops,o=>evs(o).length);
  level0(true);caption(`${ops.length} runs · ${nev} annotated anomalies · one clock each`);await wait(3800);if(!ok())return;
  caption('Inside: normal run · outside: anomalous run');await wait(3800);if(!ok())return;
  for(const op of ops){
    if(state.level!==0){level0(false);await wait(900);if(!ok())return;}
    level1(op,true);const p=pctOut(op);caption(`${op} · normal ${Math.round(p.n*100)}% vs anomalous ${Math.round(p.a*100)}% out of ideal`);await wait(1900);if(!ok())return;
    startReplay(18);await wait(18600);if(!ok())return;
    const cand=svg.selectAll('path.ev').data().filter(d=>d.cat!=='permanent');
    const best=cand.map(d=>({d,v:d3.max(S,s=>react(op,d,s))})).sort((a,b)=>(b.d.cls==='ConfirmedAnomaly')-(a.d.cls==='ConfirmedAnomaly')||b.v-a.v)[0];
    if(best){const e=best.d;{const sp=shortP(e.p).replace(/…$/,'');caption(`${e.sid} · ${sp.length>52?sp.slice(0,sp.lastIndexOf(' ',52))+' …':sp}`)}level2(e,true);await wait(4600);if(!ok())return;
      const top=S.map(s=>[s,react(op,e,s)]).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
      caption(top.length?`Reacting: ${top.join(', ')}`:'No sudden reaction: compare levels to the normal run');await wait(3600);if(!ok())return;}
  }
  caption('Your turn: click any clock');level0(false);await wait(3200);endStory();
}
function playRun(){
  if(RT){stopReplay();return}
  if(!RP)return;startReplay(RP.rate?null:32);
}
function pauseStory(){if(!storyOn||paused)return;paused=true;repWasOn=!!RT;if(RT){RT.stop();RT=null}caption.held=d3.select('#cap').text();setBtns()}
function resumeStory(){if(!storyOn||!paused)return;paused=false;if(repWasOn&&RP)startReplay(null);setBtns()}
function endStory(){storyOn=false;paused=false;if(RT){RT.stop();RT=null}if(RP)RP.set(0);caption(null);setBtns()}
d3.select('#storyBtn').on('click',()=>{if(storyOn){paused?resumeStory():pauseStory();return}if(state.level===1&&RP){playRun();return}story()});
d3.select('#stopBtn').on('click',()=>endStory());
svg.on('pointerdown.story',ev=>{if(storyOn&&ev.isTrusted)endStory()});
d3.select('#crumbs').on('pointerdown.story',()=>{if(storyOn)endStory()});
function np0(R,dom){return d3.max(R.tn)>dom[0]}
function shortP(p){p=p.replace(/\s*\(.*?\)/g,'');return p.length>70?p.slice(0,68)+'…':p}



function fitView(){
  try{
    const sw=document.querySelector('.stage-wrap'),hint=document.getElementById('hint'),foot=document.querySelector('.foot');
    const below=(hint?hint.offsetHeight:0)+(foot?foot.offsetHeight+6:0)+34;
    let fe=null,P=null;try{fe=window.frameElement;P=window.parent;void P.innerHeight}catch(e){fe=null;P=null}
    let avail;
    if(fe&&P&&P!==window){
      const frameTop=fe.getBoundingClientRect().top+(P.scrollY||0);
      avail=P.innerHeight-frameTop-sw.offsetTop-below;
    }else{
      avail=window.innerHeight-sw.getBoundingClientRect().top-(window.scrollY||0)-below;
    }
    avail=Math.max(320,Math.floor(avail));
    const maxByWidth=Math.floor(sw.parentElement.clientWidth*700/1200);
    sw.style.height=Math.min(avail,maxByWidth)+'px';
    if(fe){const hh=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().bottom+(window.scrollY||0))+4;fe.style.height=hh+'px';fe.setAttribute('height',hh)}
  }catch(e){}
}
window.addEventListener('resize',fitView);
try{if(window.parent&&window.parent!==window)window.parent.addEventListener('resize',fitView)}catch(e){}
setTimeout(fitView,50);setTimeout(fitView,400);
</script>
